
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA | Welcome</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: "Vazirmatn", sans-serif;
      overflow: hidden;
    }

    .welcome {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background:
        radial-gradient(circle at 50% 45%, #17415a80, transparent 48%),
        #080b12;
    }

    .content {
      max-width: 750px;
    }

    .logo {
      color: #65d5ff;
      font-size: 22px;
      letter-spacing: 7px;
      direction: ltr;
    }

    h1 {
      font-size: clamp(38px, 7vw, 75px);
      margin: 15px 0;
    }

    .description {
      color: #b9c8d9;
      font-size: 17px;
      line-height: 2;
    }

    .earbuds {
      width: 280px;
      max-width: 75vw;
      margin: 15px auto;
      animation: float 3s ease-in-out infinite,
                 rotate 7s ease-in-out infinite;
      filter: drop-shadow(0 20px 35px #00bfff55);
    }

    .earbuds img {
      width: 100%;
      display: block;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-22px); }
    }

    @keyframes rotate {
      0%, 100% { rotate: -5deg; }
      50% { rotate: 5deg; }
    }

    .enter {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 40px;
      border-radius: 30px;
      background: #42c8f5;
      color: #06111c;
      text-decoration: none;
      font-weight: bold;
      transition: .3s;
    }

    .enter:hover {
      transform: scale(1.07);
      box-shadow: 0 0 25px #42c8f5;
    }

    .tagline {
      color: #72879b;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="welcome">
    <div class="content">

      <div class="logo">N E X O R A</div>

      <h1>FUTURE IS HERE.</h1>

      <p class="description">
        به دنیای گجت‌های هوشمند خوش آمدید.
        <br>
        تکنولوژی، زیبایی و نوآوری در یک تجربه متفاوت.
      </p>

      <div class="earbuds">
        <img src="images/earbuds-pulse.jpg"
             alt="Wireless Earbuds">
      </div>

      <a href="index.html" class="enter">
        ورود به سایت ←
      </a>

      <p class="tagline">
        DISCOVER THE FUTURE WITH NEXORA
      </p>

    </div>
  </main>
</body>
</html>
