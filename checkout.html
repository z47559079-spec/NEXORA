
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA | تکمیل سفارش</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="checkout.css">
  <script src="checkout.js" defer></script>
</head>
<body>

  <header>
    <h2>NEXORA</h2>
    <nav>
      <a href="index.html">بازگشت به فروشگاه</a>
    </nav>
  </header>

  <main class="checkout-page">
    <h1>تکمیل سفارش 🛒</h1>
    <p>لطفاً اطلاعات خود را وارد کنید.</p>

    <div class="checkout-layout">
      <form id="checkoutForm" class="checkout-form">

        <h2>اطلاعات خریدار</h2>

        <label for="fullName">نام و نام خانوادگی</label>
        <input id="fullName" name="fullName" type="text" required>

        <label for="phone">شماره تماس</label>
        <input id="phone" name="phone" type="tel" required>

        <label for="address">آدرس کامل</label>
        <textarea id="address" name="address" required></textarea>

        <label for="postalCode">کد پستی</label>
        <input id="postalCode" name="postalCode" type="text" required>

        <h2>روش ارسال</h2>

        <label class="shipping-option">
          <input type="radio" name="shipping" value="standard" checked>
          ارسال عادی - رایگان
        </label>

        <label class="shipping-option">
          <input type="radio" name="shipping" value="express">
          ارسال سریع - ۱۵۰٬۰۰۰ تومان
        </label>

        <button type="submit" class="main-button">
          ثبت سفارش نهایی
        </button>

      </form>

      <section class="order-summary">
        <h2>خلاصه سفارش</h2>
        <div id="checkoutItems"></div>
        <div id="checkoutTotal"></div>
      </section>
    </div>

    <p id="checkoutMessage"></p>
  </main>

</body>
</html>
